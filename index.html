<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dola - 探索无限可能</title>
  <meta name="description" content="欢迎来到 Dola 的世界 - 科技、创意与未来的交汇点">
  <style>
    :root {
      --primary: #00f5ff;
      --secondary: #7c3aed;
      --accent: #f472b6;
      --bg: #0a0a0f;
      --text: #f8fafc;
      --gradient: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--primary);
      border-radius: 50%;
      animation: float 15s infinite;
      opacity: 0.6;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .hero {
      text-align: center;
      animation: fadeInUp 1s ease-out;
    }
    
    .hero h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 800;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
      animation: glow 3s ease-in-out infinite;
    }
    
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 245, 255, 0.3)); }
      50% { filter: drop-shadow(0 0 40px rgba(124, 58, 237, 0.5)); }
    }
    
    .hero p {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      color: #94a3b8;
      max-width: 600px;
      margin: 0 auto 2rem;
      line-height: 1.6;
    }
    
    .daily-quote {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2rem;
      margin: 2rem auto;
      max-width: 700px;
      animation: fadeInUp 1.2s ease-out;
    }
    
    .daily-quote blockquote {
      font-size: 1.3rem;
      font-style: italic;
      color: var(--primary);
      margin-bottom: 1rem;
      line-height: 1.7;
    }
    
    .daily-quote cite {
      color: #94a3b8;
      font-style: normal;
      font-size: 1rem;
    }
    
    .date-display {
      font-size: 1.2rem;
      color: var(--accent);
      margin-bottom: 1rem;
      font-weight: 600;
    }
    
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      margin: 3rem 0;
      animation: fadeInUp 1.4s ease-out;
    }
    
    .feature-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 2rem;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    
    .feature-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--primary);
      box-shadow: 0 10px 40px rgba(0, 245, 255, 0.1);
    }
    
    .feature-card h3 {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 1rem;
    }
    
    .feature-card p {
      color: #94a3b8;
      line-height: 1.6;
    }
    
    .contact {
      text-align: center;
      margin-top: 3rem;
      animation: fadeInUp 1.6s ease-out;
    }
    
    .contact a {
      color: var(--accent);
      text-decoration: none;
      font-size: 1.2rem;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 0.2rem;
      transition: all 0.3s ease;
    }
    
    .contact a:hover {
      color: var(--primary);
      border-color: var(--primary);
    }
    
    .footer {
      text-align: center;
      padding: 2rem;
      color: #64748b;
      font-size: 0.9rem;
      margin-top: auto;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @media (max-width: 768px) {
      .hero h1 { font-size: 2.5rem; }
      .daily-quote blockquote { font-size: 1.1rem; }
      .features { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  
  <div class="container">
    <div class="hero">
      <h1>Dola</h1>
      <p>探索科技与创意的无限可能<br>在这里，未来触手可及</p>
      
      <div class="date-display" id="dateDisplay"></div>
      
      <div class="daily-quote">
        <blockquote id="quote">"加载中..."</blockquote>
        <cite id="quoteAuthor"></cite>
      </div>
    </div>
    
    <div class="features">
      <div class="feature-card">
        <h3>🚀 创新前沿</h3>
        <p>探索最新的技术趋势，拥抱未来的可能性</p>
      </div>
      <div class="feature-card">
        <h3>💡 创意无限</h3>
        <p>每个想法都值得被实现，每个梦想都值得被追逐</p>
      </div>
      <div class="feature-card">
        <h3>🌟 持续成长</h3>
        <p>每天进步一点点，遇见更好的自己</p>
      </div>
    </div>
    
    <div class="contact">
      <p>联系我：<a href="mailto:hbtony@aliyun.com">hbtony@aliyun.com</a></p>
    </div>
    
    <div class="footer">
      <p>&copy; 2026 Dola.cn. 保留所有权利。</p>
      <p style="margin-top: 0.5rem; font-size: 0.8rem;">每日更新 · 保持好奇 · 拥抱变化</p>
    </div>
  </div>

  <script>
    // 粒子动画
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 50; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 15 + 's';
      particle.style.animationDuration = (15 + Math.random() * 10) + 's';
      particlesContainer.appendChild(particle);
    }

    // 日期显示
    const dateDisplay = document.getElementById('dateDisplay');
    const now = new Date();
    const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
    dateDisplay.textContent = now.toLocaleDateString('zh-CN', options);

    // 每日语录
    const quotes = [
      { text: "未来属于那些相信梦想之美的人。", author: "埃莉诺·罗斯福" },
      { text: "创新区分领导者和追随者。", author: "史蒂夫·乔布斯" },
      { text: "最好的预测未来的方法是创造它。", author: "彼得·德鲁克" },
      { text: "科技让不可能变为可能。", author: "未知" },
      { text: "每一天都是新的开始，抓住它。", author: "未知" },
      { text: "好奇心是学习的最强动力。", author: "阿尔伯特·爱因斯坦" },
      { text: "在变化中找到机会，在挑战中发现成长。", author: "未知" }
    ];

    const today = new Date().getDate();
    const quote = quotes[today % quotes.length];
    document.getElementById('quote').textContent = `"${quote.text}"`;
    document.getElementById('quoteAuthor').textContent = `— ${quote.author}`;

    // 动态背景颜色变化
    let hue = 0;
    setInterval(() => {
      hue = (hue + 0.1) % 360;
      document.documentElement.style.setProperty('--primary', `hsl(${hue}, 100%, 50%)`);
    }, 100);
  </script>
</body>
</html>
