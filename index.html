<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dola - 未来已来</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #4a6fa5; --accent: #ff6b6b; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 300%;
      height: 300%;
      background: radial-gradient(circle, rgba(74,111,165,0.1) 0%, transparent 70%);
      transform: rotate(30deg);
    }
    h1 {
      font-size: 5rem;
      margin-bottom: 1rem;
      background: linear-gradient(to right, #fff, #a0e7ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    .tagline {
      font-size: 2rem;
      opacity: 0.9;
      max-width: 700px;
      margin: 0 auto 2rem;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
      padding: 1rem;
      border-radius: 12px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin: 4rem 0;
    }
    .card {
      background: rgba(30, 40, 59, 0.7);
      border-radius: 20px;
      padding: 2.5rem;
      transition: transform 0.3s ease;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(74,111,165,0.3);
    }
    .card:hover { transform: translateY(-10px); }
    .card-icon { font-size: 3rem; margin-bottom: 1.5rem; }
    .card h2 { margin-bottom: 1rem; }
    .footer {
      text-align: center;
      padding: 3rem 0;
      opacity: 0.7;
      border-top: 1px solid rgba(74,111,165,0.2);
    }
    @media (max-width: 768px) {
      h1 { font-size: 3rem; }
      .tagline { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Dola</h1>
    <div class="tagline">科技与创意的无限可能</div>
    <div class="cards">
      <div class="card">
        <div class="card-icon">🚀</div>
        <h2>创新前沿</h2>
        <p>探索改变世界的下一代技术，重新定义可能性边界</p>
      </div>
      <div class="card">
        <div class="card-icon">💡</div>
        <h2>创意引擎</h2>
        <p>将灵感转化为现实，每个想法都是改变的开始</p>
      </div>
      <div class="card">
        <div class="card-icon">🌟</div>
        <h2>持续进化</h2>
        <p>在变化中成长，在探索中发现新的自我</p>
      </div>
    </div>
    <div class="footer">
      © 2026 Dola.cn · 每日更新 · 保持好奇
    </div>
  </div>
</body>
</html>
